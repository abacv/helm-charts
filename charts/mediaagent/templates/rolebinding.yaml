{{- $createViewRole := true  }}
{{- if hasKey .Values "createViewRole" }}
{{- $createViewRole = .Values.createViewRole }}
{{- end }}
{{- if $createViewRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cv.metadataname2" (list . "cv-ma-view") }}
  namespace: {{ include "cv.namespace" . }}
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ include "cv.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "cv.metadataname2" (list . "cv-ma-view") }}
  apiGroup: "rbac.authorization.k8s.io"
{{- end }}

---

{{- $createClusterViewRoleBinding := true  }}
{{- if hasKey .Values "createClusterViewRoleBinding" }}
{{- $createClusterViewRoleBinding = .Values.createClusterViewRoleBinding }}
{{- end }}

{{- $crName := include "cv.metadataname2" (list . "cv-cluster-view") }}
{{- $namespace := include "cv.namespace" . }}
# DEBUG: cv.metadataname2 (cv-cluster-view) = {{ $crName }}
{{- $combined := printf "%s-%s" $namespace $crName }}
# DEBUG: combined = {{ $combined }}

{{- if $createClusterViewRoleBinding }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $combined }}
  namespace: {{ include "cv.namespace" . }}
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ include "cv.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "cv.metadataname2" (list . "cv-cluster-view") }}
  apiGroup: "rbac.authorization.k8s.io"
{{- end }}



