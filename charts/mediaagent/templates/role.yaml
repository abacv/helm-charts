{{- $createViewRole := true  }}
{{- if hasKey .Values "createViewRole" }}
{{- $createViewRole = .Values.createViewRole }}
{{- end }}
{{- if $createViewRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cv.metadataname2" (list . "cv-ma-view") }}
  namespace: {{ include "cv.namespace" . }}
rules:
{{/*
"" indicates the core API group
*/}}
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "deployments","replicasets"]
  verbs: ["get", "watch", "list"]
{{- end }}

---

{{- $createClusterViewRole := true  }}
{{- if hasKey .Values "createClusterViewRole" }}
{{- $createClusterViewRole = .Values.createClusterViewRole }} 
{{- end }}
{{- if $createClusterViewRole  }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cv.metadataname2" (list . "cv-cluster-view") }}
  namespace: {{ include "cv.namespace" . }}
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "VolumeSnapshotClass", "VolumeSnapshot", "VolumeSnapshotContent"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
{{- end }}

